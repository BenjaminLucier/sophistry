version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # docs/src/content/snippets.test.ts needs the JS compiler API, which
      # TypeScript 7 does not ship yet. Lift this once it does.
      - dependency-name: typescript-api
        update-types: ["version-update:semver-major"]
    groups:
      # Majors arrive as their own PRs; they need reading.
      npm:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
