name: Release

# release-please keeps a release PR open with the next version and the
# CHANGELOG.md entries, built from the Conventional Commits on main. Merging it
# tags each package (`core-v0.3.0`, ...) and creates the GitHub releases; the
# jobs after it then pack every package and publish it to npm through trusted
# publishing (OIDC, no token; provenance is automatic). Each @sophistry
# package's trusted publisher on npmjs.com names this repository, this file
# (`release.yml`) and the `release` environment.
#
# "Run workflow" (workflow_dispatch) packs and publishes main as it stands,
# without a new release: the way to finish a publish that failed after the
# GitHub releases were created. Versions already on npm are skipped.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # A personal access token, not GITHUB_TOKEN: pull requests opened with
      # GITHUB_TOKEN start no workflows, so the release PR would never get the
      # CI check the branch ruleset requires.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

  # Packing goes through pnpm, which rewrites `workspace:` and `catalog:`
  # ranges and applies `publishConfig`; the publish job only uploads tarballs.
  pack:
    needs: release-please
    if: >-
      needs.release-please.outputs.releases_created == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Dependencies first, so a partial run never leaves a package on npm
      # whose dependencies aren't there.
      - run: |
          mkdir -p "$RUNNER_TEMP/tarballs"
          for p in layout core text 3d charts solidjs react; do
            (cd "packages/$p" && pnpm pack --pack-destination "$RUNNER_TEMP/tarballs")
          done
          ls "$RUNNER_TEMP/tarballs"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarballs
          path: ${{ runner.temp }}/tarballs
          if-no-files-found: error
          retention-days: 7

  # The `release` environment only deploys from main, and npm's trusted
  # publishers are bound to it, so no other branch or workflow can publish.
  publish:
    needs: pack
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarballs
          path: tarballs
      # In dependency order; a version already on npm is skipped, so a failed
      # run can simply be re-run.
      - run: |
          for p in layout core text 3d charts solidjs react; do
            # `./` keeps npm from reading `tarballs/<file>` as a GitHub
            # `user/repo` shorthand.
            tarball="$(ls ./tarballs/sophistry-$p-*.tgz)"
            version="${tarball##*-}"; version="${version%.tgz}"
            if npm view "@sophistry/$p@$version" version >/dev/null 2>&1; then
              echo "@sophistry/$p@$version is already on npm"
            else
              npm publish "$tarball" --access public
            fi
          done
